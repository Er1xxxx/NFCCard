<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flamingo — семейное кафе</title>
<meta name="description" content="Flamingo — семейное кафе для семьи и друзей с детской игровой зоной. 5-й микрорайон, 21г.">
<meta name="theme-color" content="#08543a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0a6b48;
    --green-deep: #05402b;
    --pink: #f08aa0;
    --blush: #fbe3e8;
    --cream: #fff4f1;
    --ink: #073a28;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--green-deep);
    color: var(--cream);
    font-family: "Jost", -apple-system, "Segoe UI", Arial, sans-serif;
    font-weight: 400;
    min-height: 100vh;
  }
  .page {
    max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
    padding: calc(46px + env(safe-area-inset-top, 0px)) 24px calc(36px + env(safe-area-inset-bottom, 0px));
  }

  /* Декор: фламинго и листья */
  .deco { position: absolute; pointer-events: none; }
  .fl-a { width: 210px; top: 10px; right: -34px; opacity: .2; transform: rotate(8deg); }
  .fl-b { width: 170px; bottom: 30px; left: -30px; opacity: .14; transform: scaleX(-1) rotate(-6deg); }
  .lf-a { width: 230px; top: -40px; left: -70px; opacity: .22; transform: rotate(40deg); }
  .lf-b { width: 260px; bottom: -60px; right: -90px; opacity: .2; transform: rotate(-150deg); }
  .lf-c { width: 190px; top: 46%; right: -100px; opacity: .14; transform: rotate(-20deg); }

  .content { position: relative; z-index: 1; }

  /* Шапка */
  header { text-align: center; }
  .logo {
    width: 128px; height: 128px; margin: 0 auto 20px; border-radius: 50%;
    background: #fff; border: 4px solid var(--pink);
    box-shadow: 0 0 0 8px rgba(240,138,160,.22), 0 14px 30px rgba(0,0,0,.28);
    display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 62px;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    font-family: "Playfair Display", Georgia, serif; font-weight: 700;
    font-size: 46px; line-height: 1.05; letter-spacing: .08em; color: var(--blush);
  }
  .tagline {
    margin-top: 10px; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 500;
    font-size: 19px; color: var(--pink);
  }
  .rule { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 22px auto 0; width: 70%; }
  .rule i { flex: 1; height: 1px; background: rgba(240,138,160,.55); }
  .rule b { width: 8px; height: 8px; background: var(--pink); transform: rotate(45deg); }

  /* Адрес */
  .address {
    display: flex; align-items: center; gap: 12px; margin-top: 26px;
    padding: 14px 18px; border: 1px solid rgba(240,138,160,.6); border-radius: 18px;
    background: rgba(255,255,255,.07); backdrop-filter: blur(4px);
    color: var(--cream); text-decoration: none;
  }
  .address svg { width: 26px; height: 26px; flex: none; fill: var(--pink); }
  .address span { font-size: 17px; line-height: 1.3; }
  .address small { display: block; font-size: 14px; letter-spacing: .04em; color: var(--pink); }

  /* Кнопки */
  .links { margin-top: 18px; display: grid; gap: 12px; }
  .block {
    display: flex; align-items: center; gap: 16px; width: 100%; min-height: 78px;
    padding: 12px 20px 12px 14px; border: 0; border-radius: 20px;
    background: var(--cream); color: var(--ink);
    box-shadow: 0 8px 20px rgba(0,0,0,.22);
    text-decoration: none; text-align: left; font: inherit; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .block:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,.28); }
  .block:active { transform: translateY(1px); }
  .block:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
  .block.primary { background: var(--pink); }
  .ico {
    width: 52px; height: 52px; flex: none; border-radius: 50%;
    background: var(--green); display: flex; align-items: center; justify-content: center;
  }
  .ico svg { width: 26px; height: 26px; fill: var(--blush); }
  .t { display: block; font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 20px; line-height: 1.2; }
  .s { display: block; margin-top: 3px; font-size: 15px; opacity: .78; }

  /* Wi-Fi */
  .wifi-panel {
    display: none; margin-top: -2px; padding: 16px 20px;
    background: rgba(255,244,241,.1); border: 1px dashed var(--pink); border-radius: 18px;
    font-size: 17px; line-height: 1.75; color: var(--cream);
  }
  .wifi-panel.open { display: block; }
  .wifi-panel b { font-weight: 600; color: var(--blush); font-size: 19px; }
  .wifi-panel button {
    margin-top: 8px; font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); background: var(--pink);
    border: 0; border-radius: 999px; padding: 9px 20px; cursor: pointer;
  }

  .foot { text-align: center; margin-top: 30px; font-size: 14px; letter-spacing: .06em; color: var(--pink); opacity: .8; }

  @media (prefers-reduced-motion: reduce) { .block { transition: none; } }
</style>
</head>
<body>

<!-- Векторные заготовки: фламинго и лист -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="flamingo" viewBox="0 0 100 160">
      <path d="M30 78C30 60 55 52 74 62c12 6 12 22-4 26-14 4-30 4-40-10z" fill="#f08aa0"/>
      <path d="M30 78C20 80 14 90 9 100c13-4 24-8 31-14z" fill="#f08aa0"/>
      <path d="M72 64C92 52 90 30 70 26c-14-3-20-12-12-18" fill="none" stroke="#f08aa0" stroke-width="7" stroke-linecap="round"/>
      <circle cx="58" cy="9" r="5.500" fill="#f08aa0"/>
      <path d="M55 10l-10 7 11-2z" fill="#fbe3e8"/>
      <path d="M52 90l-2 60M60 90l4 30-8 10" fill="none" stroke="#f08aa0" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="leaf" viewBox="0 0 240 120">
      <path d="M0 60C40 0 160 0 240 60 160 120 40 120 0 60z" fill="#7fd6a8"/>
      <path d="M0 60h240" stroke="#05402b" stroke-width="2.500" fill="none"/>
      <path d="M50 60l30-24M90 60l36-28M130 60l36-26M50 60l30 24M90 60l36 28M130 60l36 26" stroke="#05402b" stroke-width="1.500" fill="none"/>
    </symbol>
  </defs>
</svg>

<div class="page">
  <svg class="deco lf-a" viewBox="0 0 240 120"><use href="#leaf"/></svg>
  <svg class="deco lf-b" viewBox="0 0 240 120"><use href="#leaf"/></svg>
  <svg class="deco lf-c" viewBox="0 0 240 120"><use href="#leaf"/></svg>
  <svg class="deco fl-a" viewBox="0 0 100 160"><use href="#flamingo"/></svg>
  <svg class="deco fl-b" viewBox="0 0 100 160"><use href="#flamingo"/></svg>

  <div class="content">
    <header>
      <div class="logo">
        <!-- Положите логотип рядом с index.html под именем logo.jpg -->
        <img src="logo.jpg" alt="Flamingo" onerror="this.remove(); this.parentNode.textContent='🦩'">
      </div>
      <h1>FLAMINGO</h1>
      <p class="tagline">Семейное кафе с детской игровой зоной</p>
      <div class="rule"><i></i><b></b><i></i></div>
    </header>

    <a class="address" id="address" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7zm0 9.500A2.500 2.500 0 1112 6.500a2.500 2.500 0 010 5z"/></svg>
      <span><small>Ждём вас в гости</small>5-й микрорайон, 21г</span>
    </a>

    <main class="links" id="links"></main>

    <p class="foot">Powered by MercuryNFC</p>
  </div>
</div>

<script>
/* ============ НАСТРОЙКИ — меняйте только этот блок ============ */
const CONFIG = {
  menuUrl:      "https://er1xxxx.github.io/FlamingoMenu/",          // ссылка на меню
  reviewUrl:    "https://2gis.kz/almaty/firm/70000001039733000/tab/reviews",                  // ссылка на отзывы в 2ГИС
  instagramUrl: "https://www.instagram.com/flamingovalmaty?stkn=MW4xNW1idnZ3bDk2cQ==",
  tiktokUrl:    "https://www.tiktok.com/@flamingovalmaty?_r=1&_t=ZS-9A0Rk9ifMYc",
  addressUrl:   "https://2gis.kz/almaty/firm/70000001039733000",                  // ссылка на карту (страница кафе в 2ГИС)
  wifiName:     "Flamingo",                    // название сети Wi-Fi
  wifiPassword: "Era_Bakti"                           // пароль ("" если сеть открытая)
};
/* ============================================================== */

document.getElementById("address").href = CONFIG.addressUrl;

const ICONS = {
  book: '<svg viewBox="0 0 24 24"><path d="M12 6.500C10.600 5.400 8.600 5 6 5c-1.400 0-2.700.2-4 .6v13.200c1.300-.4 2.600-.6 4-.6 2.600 0 4.600.4 6 1.500 1.400-1.100 3.400-1.500 6-1.500 1.400 0 2.700.2 4 .6V5.600C20.700 5.200 19.400 5 18 5c-2.600 0-4.600.4-6 1.500z"/></svg>',
  wifi: '<svg viewBox="0 0 24 24"><path d="M12 18.500a1.800 1.800 0 100 3.600 1.800 1.800 0 000-3.600zM2.100 8.900l1.700 1.900a11.400 11.400 0 0116.400 0l1.700-1.900a14 14 0 00-19.800 0zm3.500 3.900l1.700 1.900a6.300 6.300 0 019.400 0l1.700-1.900a8.800 8.800 0 00-12.800 0z"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 2l3 6.900 7.500.7-5.700 4.900 1.700 7.300L12 17.800 5.500 21.800l1.700-7.300L1.500 9.600 9 8.900z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24"><path d="M7.500 2h9A5.500 5.500 0 0122 7.500v9a5.500 5.500 0 01-5.500 5.500h-9A5.500 5.500 0 012 16.500v-9A5.500 5.500 0 017.500 2zm0 2A3.500 3.500 0 004 7.500v9A3.500 3.500 0 007.500 20h9a3.500 3.500 0 003.500-3.500v-9A3.500 3.500 0 0016.500 4h-9zM12 7a5 5 0 110 10 5 5 0 010-10zm0 2a3 3 0 100 6 3 3 0 000-6zm5.500-3.200a1.200 1.200 0 110 2.400 1.200 1.200 0 010-2.400z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24"><path d="M16.600 2h-3.200v13.400a2.800 2.800 0 11-2-2.700V9.400a6 6 0 105.200 5.900V8.900a7.500 7.500 0 004.400 1.400V7.100A4.400 4.400 0 0116.600 2z"/></svg>'
};

const blocks = [
  { cls: "primary", icon: "book",      title: "Меню",           sub: "Ассортимент нашей кухни и бара", href: CONFIG.menuUrl },
  { cls: "",        icon: "wifi",      title: "Wi-Fi",          sub: "Бесплатный интернет для гостей", wifi: true },
  { cls: "",        icon: "star",      title: "Оставить отзыв", sub: "Расскажите о нас в 2ГИС",        href: CONFIG.reviewUrl },
  { cls: "",        icon: "instagram", title: "Instagram",      sub: "Фото и новости кафе",            href: CONFIG.instagramUrl },
  { cls: "",        icon: "tiktok",    title: "TikTok",         sub: "Смотрите наши видео",            href: CONFIG.tiktokUrl }
];

const root = document.getElementById("links");

blocks.forEach(b => {
  const el = document.createElement(b.wifi ? "button" : "a");
  el.className = "block " + b.cls;
  if (b.wifi) el.type = "button";
  else { el.href = b.href; el.target = "_blank"; el.rel = "noopener noreferrer"; }
  el.innerHTML = '<span class="ico">' + ICONS[b.icon] + '</span>' +
    '<span class="txt"><span class="t">' + b.title + '</span><span class="s">' + b.sub + '</span></span>';
  root.appendChild(el);

  if (b.wifi) {
    const panel = document.createElement("div");
    panel.className = "wifi-panel";
    panel.innerHTML = "Сеть: <b></b>" +
      (CONFIG.wifiPassword ? "<br>Пароль: <b></b><br><button type='button'>Скопировать пароль</button>" : "<br>Пароль не нужен");
    const bs = panel.querySelectorAll("b");
    bs[0].textContent = CONFIG.wifiName;
    if (CONFIG.wifiPassword) {
      bs[1].textContent = CONFIG.wifiPassword;
      const copy = panel.querySelector("button");
      copy.onclick = () => {
        const done = () => { copy.textContent = "Скопировано!"; setTimeout(() => copy.textContent = "Скопировать пароль", 1800); };
        if (navigator.clipboard) navigator.clipboard.writeText(CONFIG.wifiPassword).then(done, done); else done();
      };
    }
    root.appendChild(panel);
    el.onclick = () => panel.classList.toggle("open");
  }
});
</script>
</body>
</html>
